[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashpilot"
version = "0.1.0"
description = "Agent for the finance back-office: deterministic bank-ledger reconciliation, Razorpay settlement verification and forward cash forecasting (7-30 days)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cashpilot team" }]
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov"]  # coverage is optional; the suite needs only pytest

[project.scripts]
cashpilot = "cashpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]

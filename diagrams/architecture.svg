<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1080" height="620" fill="#f8fafc"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#0f172a">Cashpilot — bank feed to cash position</text>
  <text x="24" y="54" fill="#475569">grey = deterministic code · teal = the only two AI touch points · dashed = ground truth, never read by the engine</text>

  <!-- inputs -->
  <g>
    <rect x="24" y="76" width="200" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="100" font-weight="700" fill="#0f172a">Inputs (CSV exports)</text>
    <text x="40" y="122" fill="#334155">bank_statement.csv</text>
    <text x="40" y="140" fill="#334155">invoices.csv / bills.csv</text>
    <text x="40" y="158" fill="#334155">payment_advices.csv</text>
    <text x="40" y="176" fill="#334155">razorpay_settlements.csv</text>
    <text x="40" y="194" fill="#334155">razorpay_payments / refunds</text>
    <text x="40" y="212" fill="#94a3b8">opening_balance.csv</text>
  </g>

  <g stroke-dasharray="5 4">
    <rect x="24" y="244" width="200" height="66" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="40" y="266" font-weight="700" fill="#334155">Ground truth</text>
    <text x="40" y="284" fill="#64748b">truth_matches.csv</text>
    <text x="40" y="300" fill="#64748b">truth_future_cash.csv</text>
  </g>

  <!-- ingest -->
  <rect x="256" y="76" width="164" height="234" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="272" y="100" font-weight="700" fill="#0f172a">ingest.py</text>
  <text x="272" y="122" fill="#334155">typed records</text>
  <text x="272" y="140" fill="#334155">int paise, never float</text>
  <text x="272" y="158" fill="#334155">DD/MM/YYYY + ISO</text>
  <text x="272" y="176" fill="#334155">column aliases</text>
  <text x="272" y="200" fill="#b45309">unreadable row →</text>
  <text x="272" y="216" fill="#b45309">PARSE_FAILURE</text>
  <text x="272" y="232" fill="#b45309">exception, not a</text>
  <text x="272" y="248" fill="#b45309">silent skip</text>
  <text x="272" y="278" fill="#94a3b8">as_of = manifest or</text>
  <text x="272" y="292" fill="#94a3b8">latest line date</text>

  <!-- recon -->
  <rect x="452" y="76" width="252" height="290" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="468" y="100" font-weight="700" fill="#0f172a">recon/engine.py — tier ladder</text>
  <text x="468" y="122" fill="#334155">t0 duplicate UTR / amount quarantine</text>
  <text x="468" y="140" fill="#334155">t1 settlement id · t2 advice UTR</text>
  <text x="468" y="158" fill="#334155">t3 document number (config regex)</text>
  <text x="468" y="176" fill="#334155">t4 amount exact · t5 amount + name</text>
  <text x="468" y="194" fill="#334155">t6 lumpsum subset-sum (token blocks)</text>
  <text x="468" y="212" fill="#334155">t7 global fuzzy assignment</text>
  <text x="468" y="230" fill="#334155">t8 single-candidate inference</text>
  <line x1="468" y1="246" x2="688" y2="246" stroke="#e2e8f0"/>
  <text x="468" y="266" fill="#0f766e">settlement docs live outside DocIndex,</text>
  <text x="468" y="282" fill="#0f766e">so amounts cannot steal a gateway credit</text>
  <text x="468" y="302" fill="#334155">auto-post only if confidence ≥ floor,</text>
  <text x="468" y="318" fill="#334155">tier is not pure similarity, one document set</text>
  <text x="468" y="338" fill="#334155">every match carries evidence + confidence</text>

  <!-- verify -->
  <rect x="736" y="76" width="180" height="132" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="752" y="100" font-weight="700" fill="#0f172a">verify/settlements</text>
  <text x="752" y="122" fill="#334155">fee = Σ gross × rate[mode]</text>
  <text x="752" y="140" fill="#334155">+ TMN, GST on fees,</text>
  <text x="752" y="158" fill="#334155">TDS on commission</text>
  <text x="752" y="178" fill="#334155">credit vs expected net</text>
  <text x="752" y="196" fill="#b45309">T+2 gap, mis-slab pricing</text>

  <!-- ai -->
  <rect x="736" y="222" width="180" height="144" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
  <text x="752" y="246" font-weight="700" fill="#0f766e">ai/triage  (LLM #1)</text>
  <text x="752" y="268" fill="#134e4a">only ambiguous codes</text>
  <text x="752" y="286" fill="#134e4a">fixed taxonomy, JSON only</text>
  <text x="752" y="304" fill="#134e4a">hard call budget</text>
  <text x="752" y="322" fill="#134e4a">invalid answers discarded</text>
  <text x="752" y="344" fill="#134e4a">advisory: never posts</text>

  <!-- forecast -->
  <rect x="256" y="392" width="448" height="188" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="272" y="416" font-weight="700" fill="#0f172a">forecast/engine.py — a book model</text>
  <text x="272" y="440" fill="#334155">1. per-party delay density (Gaussian kernel, shrunk n/(n+8))</text>
  <text x="272" y="458" fill="#334155">2. survival with cure fraction:  p·q(win) / (p·S(age) + 1 − p)</text>
  <text x="272" y="476" fill="#334155">3. weekday redistribution of the placement (renormalised)</text>
  <text x="272" y="494" fill="#334155">4. same-window churn: raised and settled inside the horizon</text>
  <text x="272" y="512" fill="#334155">5. gateway capture cadence (T+2 lag, its own distribution)</text>
  <text x="272" y="536" fill="#334155">expectation analytic → P10/P50/P90 from 2,000 sampled paths</text>
  <text x="272" y="556" fill="#b45309">no "unexplained run-rate" term — it double counted (FAILURES #2)</text>

  <!-- backtest -->
  <g stroke-dasharray="5 4">
    <rect x="736" y="392" width="180" height="188" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  </g>
  <text x="752" y="416" font-weight="700" fill="#334155">forecast/backtest</text>
  <text x="752" y="438" fill="#64748b">rolling origins, every</text>
  <text x="752" y="454" fill="#64748b">origin re-runs recon on</text>
  <text x="752" y="470" fill="#64748b">data ≤ origin</text>
  <text x="752" y="490" fill="#64748b">ledger status reset</text>
  <text x="752" y="510" fill="#64748b">vs seasonal naive,</text>
  <text x="752" y="526" fill="#64748b">moving avg, due-date sum</text>
  <text x="752" y="546" fill="#64748b">top-25 settle ranking</text>
  <text x="752" y="566" fill="#64748b">+ band hit rate</text>

  <!-- report -->
  <rect x="944" y="76" width="112" height="504" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="958" y="100" font-weight="700" fill="#0f172a">report.py</text>
  <text x="958" y="124" fill="#334155">7 CSVs</text>
  <text x="958" y="142" fill="#334155">5 markdown</text>
  <text x="958" y="160" fill="#334155">dashboard</text>
  <text x="958" y="178" fill="#334155">(inline SVG)</text>
  <text x="958" y="206" fill="#334155">run_manifest</text>
  <text x="958" y="224" fill="#334155">.json</text>
  <line x1="958" y1="242" x2="1042" y2="242" stroke="#e2e8f0"/>
  <text x="958" y="262" font-weight="700" fill="#0f172a">eval/accuracy</text>
  <text x="958" y="284" fill="#64748b">set equality</text>
  <text x="958" y="302" fill="#64748b">vs truth</text>
  <text x="958" y="320" fill="#64748b">partial ≠ ok</text>
  <text x="958" y="338" fill="#64748b">quarantine</text>
  <text x="958" y="356" fill="#64748b">must stay</text>
  <text x="958" y="374" fill="#64748b">unmatched</text>
  <line x1="958" y1="392" x2="1042" y2="392" stroke="#e2e8f0"/>
  <text x="958" y="412" font-weight="700" fill="#0f172a">ai/narrative</text>
  <text x="958" y="434" fill="#0f766e">LLM #2, digits</text>
  <text x="958" y="452" fill="#0f766e">checked against</text>
  <text x="958" y="470" fill="#0f766e">evidence block,</text>
  <text x="958" y="488" fill="#0f766e">else template</text>
  <text x="958" y="516" fill="#334155">brief.md</text>
  <text x="958" y="540" fill="#94a3b8">no network</text>
  <text x="958" y="556" fill="#94a3b8">by default</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M224,150 L256,150"/>
    <path d="M420,190 L452,190"/>
    <path d="M704,140 L736,140"/>
    <path d="M704,300 L736,300"/>
    <path d="M452,330 C420,360 400,370 380,392"/>
    <path d="M826,208 L826,222"/>
    <path d="M916,470 L944,470"/>
    <path d="M916,140 L944,140"/>
    <path d="M632,364 L632,392"/>
  </g>
  <g stroke="#0f766e" stroke-width="1.5" fill="none" marker-end="url(#a2)">
    <path d="M826,366 C826,380 700,380 660,392" opacity="0.35"/>
    <path d="M1000,140 C1010,180 1010,200 1000,242" opacity="0.5"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M124,310 C124,340 470,352 520,366"/>
    <path d="M916,120 C930,120 940,150 944,262"/>
  </g>
  <text x="150" y="352" fill="#94a3b8">truth never reaches the engine</text>
</svg>
